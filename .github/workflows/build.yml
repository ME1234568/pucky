name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Pucky.sln
      - run: dotnet build Pucky.sln --configuration Release --no-restore
      - run: dotnet run --project tests/Pucky.Tests/Pucky.Tests.csproj --configuration Release --no-build

  publish:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: >
          dotnet publish src/Pucky.App/Pucky.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output artifacts/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: pucky-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
