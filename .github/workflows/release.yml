name: release

# Three ways to release:
#  1. Merge a pull request into main: releases automatically. The bump comes
#     from the PR's labels: release:major, release:minor, or patch by default.
#     Label the PR release:skip to merge without releasing, and
#     release:prerelease to mark the GitHub Release as a pre-release.
#  2. Actions > release > Run workflow: choose the bump yourself.
#  3. Push a tag such as 1.2.0 (or v1.2.0) yourself: that exact version is
#     released.
#
# The git tag is the source of truth for the version: releases only push a
# tag, never a commit, so they work with branch protection on main. The
# packages are built with the tagged version passed to the build;
# <Version> in Directory.Build.props is only the base for local and CI
# builds and the lowest version a release will pick.
#
# Nothing is tagged or published unless the build and tests pass. The tag
# pushed here uses GITHUB_TOKEN, so it does not trigger this workflow again.
on:
  # pull_request_target (not pull_request) so the token can push the tag even
  # for PRs from forks. It is safe here because the workflow only checks out
  # main after the merge, never the PR's own code.
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: Mark the GitHub Release as a pre-release
        type: boolean
        default: false
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    # A closed PR only releases when it was merged and isn't labelled
    # release:skip.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged &&
       !contains(github.event.pull_request.labels.*.name, 'release:skip'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # After a merge, release the base branch as it now stands.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || '' }}
          # Full history and tags to find the latest release.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = push ]; then
            # A pushed tag is released as is.
            tag="$REF_NAME"
            version="${tag#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$tag' is not a valid MAJOR.MINOR.PATCH[-suffix] version."
              exit 1
            fi
            if [[ "$version" == *-* ]]; then prerelease="true"; else prerelease="false"; fi
          else
            if [ "$EVENT_NAME" = pull_request_target ]; then
              # Bump from the merged PR's labels; the largest one wins.
              case "$PR_LABELS" in
                *'"release:major"'*) BUMP="major" ;;
                *'"release:minor"'*) BUMP="minor" ;;
                *) BUMP="patch" ;;
              esac
              case "$PR_LABELS" in
                *'"release:prerelease"'*) PRERELEASE_INPUT="true" ;;
                *) PRERELEASE_INPUT="false" ;;
              esac
            fi

            # Start from the highest existing release tag (with or without a
            # leading v), but never below <Version> in Directory.Build.props.
            props_version="$(sed -n 's:.*<Version>[[:space:]]*\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)[[:space:]]*</Version>.*:\1:p' Directory.Build.props | head -n 1)"
            base="$(
              { git tag --list | sed -n 's/^v\{0,1\}\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p'
                [ -n "$props_version" ] && echo "$props_version"
              } | sort -t. -k1,1n -k2,2n -k3,3n | tail -n 1
            )"
            base="${base:-0.0.0}"
            echo "Latest version: $base"

            IFS=. read -r major minor patch <<< "$base"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'."; exit 1 ;;
            esac
            version="$major.$minor.$patch"
            tag="$version"
            prerelease="$PRERELEASE_INPUT"

            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null \
              || git rev-parse -q --verify "refs/tags/v$tag" >/dev/null; then
              echo "::error::Tag $tag already exists."
              exit 1
            fi
          fi

          echo "Releasing $version as tag $tag (prerelease: $prerelease)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Pucky.sln

      - name: Build
        run: dotnet build Pucky.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/Pucky.Tests/Pucky.Tests.csproj --configuration Release --no-build

      - name: Tag release
        if: github.event_name != 'push'
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

  package:
    needs: prepare
    uses: ./.github/workflows/package.yml
    with:
      # Build exactly the tagged commit, stamped with the released version.
      ref: refs/tags/${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
      retention-days: 7

  release:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pucky-*
          path: dist
          merge-multiple: true

      - name: Verify packages and write checksums
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          count="$(find . -maxdepth 1 -type f \( -name 'pucky-*.zip' -o -name 'pucky-*.tar.gz' \) | wc -l)"
          if [ "$count" -ne 6 ]; then
            echo "::error::Expected 6 packages, found $count."
            exit 1
          fi
          sha256sum pucky-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
